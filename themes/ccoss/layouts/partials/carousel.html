<link
  rel="stylesheet"
  href="https://cdn.jsdelivr.net/npm/swiper@9/swiper-bundle.min.css"
/>

<!-- Demo styles -->
<style>
  .swiper {
    width: 100%;
    height: 50%;
  }

  .swiper-slide {
    text-align: center;
    font-size: 18px;
    background: transparent;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  .swiper-slide img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
</style>

<section style="background: white; margin-top: -33px">
  <br /><br />
  <h2 class="mt-3 text-center">PRÓXIMOS EVENTOS</h2>
  <br />
  <!-- Swiper -->
  <div class="swiper mySwiper container">
    <div class="swiper-wrapper">
      <div class="swiper-slide">
        <a
          href="https://events.gnome.org/event/376/"
          target="_blank"
          rel="noopener noreferrer"
        >
          <img src="/images/carousel/gnome2026.jpeg" alt="GNOME Asia 2026" />
        </a>
      </div>

      <div class="swiper-slide">
        <a href="https://www.nerdearla.com" target="_blank"
          ><img src="images/logos/nerdearla.jpeg"
        /></a>
      </div>
    </div>
    <div class="swiper-pagination"></div>
  </div>

  <br /><br /><br />

  <!-- Swiper JS -->
  <script src="https://cdn.jsdelivr.net/npm/swiper@9/swiper-bundle.min.js"></script>

  <!-- Initialize Swiper -->
  <script>
    var swiper = new Swiper('.mySwiper', {
      slidesPerView: 1,
      spaceBetween: 10,
      autoplay: true,
      autoplaySpeed: 10000,
      pagination: {
        el: '.swiper-pagination',
        clickable: true
      },
      breakpoints: {
        '@0.00': {
          slidesPerView: 1,
          spaceBetween: 10
        },
        '@0.75': {
          slidesPerView: 2,
          spaceBetween: 20
        },
        '@1.00': {
          slidesPerView: 2,
          spaceBetween: 40
        },
        '@1.50': {
          slidesPerView: 2,
          spaceBetween: 50
        }
      }
    })
  </script>
</section>
